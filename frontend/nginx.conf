server {
    listen 80;
    server_name _;

    # Docker's embedded DNS. Without a resolver, nginx resolves "api" once at
    # startup and keeps that IP forever — so restarting the API container makes
    # this proxy answer 502 until nginx is restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8000;

    root /usr/share/nginx/html;
    index index.html;

    # The API lives behind the same origin, so the browser never makes a
    # cross-origin request. Pass the URI through unchanged so /api/v1/leads
    # reaches the API's real route.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # React Router: every unknown path is the SPA, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
