services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/webloom_sales_engine
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/webloom_sales_engine_test
      ENVIRONMENT: development
      SQL_ECHO: "false"
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 10s
      timeout: 5s
      retries: 5

  api-test:
    profiles: ["test"]
    build:
      context: ./backend
    entrypoint: ["pytest"]
    command: ["-v"]
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/webloom_sales_engine
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/webloom_sales_engine_test
      ENVIRONMENT: development
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
